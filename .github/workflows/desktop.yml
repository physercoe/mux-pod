name: Desktop

# WS2 of docs/plans/desktop-control-plane.md. The desktop control plane is a
# separate web-tech client (Electron + React + TS; ADR-055). This workflow is
# its gate: the frontend unit-tests, typechecks, and builds (browser target),
# the Electron shell tests + bundles, and the vault crypto builds to WASM
# (there is no local Rust toolchain, so CI is the Rust build gate).

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'design-tokens/**'
      - 'scripts/lint-desktop-tokens.sh'
      - 'scripts/desktop-token-baseline.txt'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'design-tokens/**'
      - 'scripts/lint-desktop-tokens.sh'
      - 'scripts/desktop-token-baseline.txt'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Typecheck + build (also verifies shared tokens flow into the CSS)
        run: npm run build
      - name: Design-token ratchet (#318 — no new hex / --color-* leaks, no phantom tokens)
        run: bash ../scripts/lint-desktop-tokens.sh
      - name: Stage frontend for E2E
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-ci-frontend
          path: desktop/dist/
          if-no-files-found: error
          retention-days: 1

  electron-shell:
    # ADR-055 M1: the Electron shell is a self-contained package under
    # desktop/electron/. Gate it (typecheck + esbuild bundle) without pulling the
    # ~100 MB Electron binary — typecheck/build need only the bundled types.
    name: Electron shell typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      - name: Install (skip Electron binary — typecheck/build only)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run build
      - run: npm test # sync-core fixture suite (node:test, native TS)

  vault-wasm:
    # ADR-055 M2.6 (D-3): the vault crypto is COMPILED to WASM for the Electron
    # shell, not reimplemented in TS (byte-compat with the Dart client + the
    # Tauri build). This gate proves vault-core's crypto (native `cargo test`,
    # incl. the NIST AES-GCM KATs) AND that it builds to a nodejs-target WASM
    # whose round-trip works. No local Rust toolchain here — CI is the Rust gate.
    name: Vault WASM build + crypto tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasm-pack.tar.gz"
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz -o "$archive"
          echo "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
      - name: vault-core crypto tests (native)
        working-directory: desktop/vault-core
        run: cargo test
      - name: Build vault-wasm (nodejs target)
        working-directory: desktop/vault-wasm
        run: wasm-pack build --target nodejs --release
      - name: WASM round-trip smoke test (seal→open, device + recovery wrap→unwrap)
        working-directory: desktop/vault-wasm
        run: |
          node -e '
            const v = require("./pkg/vault_wasm.js");
            const k = v.vault_generate_key();
            if (v.vault_open(k, v.vault_seal(k, "hi")) !== "hi") throw new Error("seal/open");
            const dev = JSON.parse(v.vault_generate_device());
            const de = v.vault_wrap_for_device(k, dev.public_key);
            if (v.vault_unwrap_device(dev.seed, de) !== k) throw new Error("device wrap");
            const code = v.vault_generate_recovery_code();
            const re = v.vault_wrap_for_recovery(k, code);
            if (v.vault_unwrap_recovery(code, re) !== k) throw new Error("recovery wrap");
            console.log("vault WASM round-trips: ok");
          '

  e2e:
    # ADR-055 §7 row 14: drive the REAL Electron app with Playwright under xvfb
    # (there is no local Electron binary on the dev host, so CI is the E2E gate).
    # The smoke suite proves the app boots + paints and pins the invariants the
    # M4 guard-deletions rely on (secure app:// origin, injected bridge). It
    # unblocks verifying the remaining paydowns (blob-iframe, sizedSvg,
    # base64→bytes) against real Chromium instead of by faith.
    name: E2E (Playwright + Electron, xvfb)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      # node-gyp (pinned to 10 via package overrides) needs Python for the
      # node-pty Electron-ABI rebuild; pin 3.11 so it has distutils.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download the verified frontend (dist/ — the app the shell loads)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-ci-frontend
          path: desktop/dist
      - name: Install Electron shell deps (incl. the real Electron binary + Playwright)
        working-directory: desktop/electron
        run: npm ci # NOT ELECTRON_SKIP_BINARY_DOWNLOAD — the E2E run needs the binary
      # The terminal test spawns a real shell via node-pty, a native addon built
      # by npm against system Node — its ABI differs from Electron's, so rebuild
      # it against the Electron headers. Plain node-gyp, NOT @electron/rebuild
      # (electron-builder's forked rebuilder deadlocks — issue #358; same recipe
      # as desktop-electron-release.yml). node-pty is the only addon that needs
      # it (@napi-rs/keyring is N-API prebuilt).
      - name: Rebuild node-pty for the Electron ABI (plain node-gyp)
        working-directory: desktop/electron
        run: |
          NODE_GYP="$PWD/node_modules/.bin/node-gyp"
          EV=$(node -p "require('electron/package.json').version")
          ARCH=$(node -p "process.arch")
          echo "Rebuilding node-pty for Electron $EV ($ARCH)"
          cd node_modules/node-pty
          "$NODE_GYP" rebuild --target="$EV" --arch="$ARCH" --dist-url=https://electronjs.org/headers
          ls -la build/Release/*.node
      - name: Build the Electron main/preload bundles
        working-directory: desktop/electron
        run: npm run build
      - name: Install Chromium/Electron shared libraries
        working-directory: desktop/electron
        run: npx playwright install-deps chromium
      - name: Run the E2E smoke suite (headless via xvfb)
        working-directory: desktop/electron
        run: xvfb-run -a npm run test:e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: desktop/electron/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
